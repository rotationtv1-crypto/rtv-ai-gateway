name = "rtv-ai-gateway"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[env.production]
name = "rtv-ai-gateway-prod"
routes = [
  { pattern = "ai.rotationtv.live/v1/*", zone_name = "rotationtv.live" }
]

# Secrets (set via `wrangler secret put`):
# - CLOUDFLARE_API_TOKEN
# - KIMI_API_KEY
# - ADMIN_SECRET

[vars]
ENVIRONMENT = "production"
ACCOUNT_ID = ""
GATEWAY_NAME = "default"
AI_GATEWAY_BASE = "https://gateway.ai.cloudflare.com/v1"
# Optional Stream HLS for EPG (or set STREAM_UID_NN + STREAM_CUSTOMER):
# STREAM_HLS_DEFAULT = ""
# STREAM_CUSTOMER = "customer-xxxxxxxx"

# Optional EPG cache. Create then uncomment with a real id:
#   npx wrangler kv namespace create EPG_CACHE
# [[kv_namespaces]]
# binding = "EPG_CACHE"
# id = "<kv-namespace-id>"
